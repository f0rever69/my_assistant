  # File operations tools
  - name: ls
    group: file:read
    use: my_assistant.sandbox.tools:ls_tool

  - name: read_file
    group: file:read
    use: my_assistant.sandbox.tools:read_file_tool

  - name: glob
    group: file:read
    use: my_assistant.sandbox.tools:glob_tool
    max_results: 200

  - name: grep
    group: file:read
    use: my_assistant.sandbox.tools:grep_tool
    max_results: 100

  - name: workspace_search
    group: file:read
    use: my_assistant.sandbox.workspace_search:workspace_search_tool
    max_results: 8

  - name: write_file
    group: file:write
    use: my_assistant.sandbox.tools:write_file_tool

  - name: str_replace
    group: file:write
    use: my_assistant.sandbox.tools:str_replace_tool

  - name: delete_file
